<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão · Revisa</title>
  <meta name="theme-color" content="#1f5c45">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/estilo.css">
</head>
<body>
  {# Página guardada pelo service worker: sem dados da conta nem formulários. #}
  <main class="conteudo estreito">
    <div class="painel vazio">
      <img src="/static/favicon.svg" alt="" width="44" height="44">
      <p class="selo" style="margin-top:14px">Sem conexão</p>
      <h1>Você está offline.</h1>
      <p>O Revisa precisa de internet para carregar e salvar suas sessões. Confira a conexão e tente de novo.</p>
      <a class="btn" href="/hoje">Tentar de novo</a>
    </div>
  </main>
</body>
</html>
